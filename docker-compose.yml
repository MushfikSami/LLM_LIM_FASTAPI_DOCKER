
services:
  backend:
    build: ./backend
    container_name: gemini_fastapi
    ports:
      - "8080:8080"
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: gemini_streamlit
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8080
      # Pass the same secret key to the frontend so it can authenticate
      - API_SECRET_KEY=my-super-secret-key 
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Mounts your local config file directly into the Prometheus container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Sets your default login credentials for the Grafana UI
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus